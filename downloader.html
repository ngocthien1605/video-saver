<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Saver — Downloader</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="dl">
  <main>
    <h1 id="title">Loading…</h1>
    <div id="src" class="mono"></div>
    <div id="controls"></div>
    <div class="actions">
      <button id="start" class="primary" disabled>Start</button>
      <button id="stop" disabled>Stop &amp; save</button>
    </div>
    <progress id="bar" max="1" value="0"></progress>
    <div id="stat"></div>
    <div id="log"></div>
    <p class="hint">Terminal commands target PowerShell on Windows (not cmd.exe), or a POSIX shell on macOS/Linux.</p>
  </main>
  <script src="common.js"></script>
  <script src="captures.js"></script>
  <script src="replay.js"></script>
  <script src="fetcher.js"></script>
  <script src="downloader.js"></script>
</body>
</html>
